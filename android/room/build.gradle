plugins {
    alias(libs.plugins.android.library)
}

android {
    compileSdk 37

    namespace 'com.beetle.room'

    defaultConfig {
        minSdk 24

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Android Gradle Plugin cannot package direct local AARs into a library AAR.
    // The app supplies these runtime dependencies from this module's libs directory.
    compileOnly files('libs/libwebrtc.aar', 'libs/protooclient.aar')
}
